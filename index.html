<!-- Custom WhatsApp Popup Modal -->
<div id="customModal" class="modal-overlay" onclick="closeModal()">

      <img src="elogo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <button class="modal-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
  function showPopup(title, htmlMessage) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerHTML = htmlMessage;
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedUserEmail = localStorage.getItem('rememberedUserEmail');
    const activeUser = localStorage.getItem('loggedInUser');

    if (activeUser) {
      document.getElementById('loginOverlay').style.display = 'none';
      loadUserData(JSON.parse(activeUser));
    } else if (savedUserEmail) {
      setupPinPrompt(savedUserEmail);
    } else {
      setupUsernamePrompt();
    }

    let savedBalance = localStorage.getItem('userBalance');
    if (savedBalance === null) {
      savedBalance = 50000;
      localStorage.setItem('userBalance', savedBalance);
    }
  });

  function setupUsernamePrompt() {
    document.getElementById('loginTitle').innerText = "Welcome Back";
    document.getElementById('loginSubtitle').innerText = "Please enter your username (Email) to setup your account";
    document.getElementById('inputLabel').innerText = "Username (Email)";
    const input = document.getElementById('authInput');
    input.type = "text";
    input.removeAttribute('maxlength');
    input.placeholder = "Enter your username...";
    input.value = "";
    document.getElementById('authBtn').innerText = "Continue";
    document.getElementById('loginBackBtn').style.display = 'none';
  }

  function setupPinPrompt(email) {
    document.getElementById('loginTitle').innerText = "Enter 5-Digit PIN";
    document.getElementById('loginSubtitle').innerText = `Welcome back, ${email}. Enter your account PIN to continue.`;
    document.getElementById('inputLabel').innerText = "5-Digit PIN";
    const input = document.getElementById('authInput');
    input.type = "password";
    input.maxLength = 5;
    input.placeholder = "Enter 5-digit PIN...";
    input.value = "";
    document.getElementById('authBtn').innerText = "Login";
    document.getElementById('loginBackBtn').style.display = 'flex';
  }

  function resetToUsernamePrompt() {
    localStorage.removeItem('rememberedUserEmail');
    setupUsernamePrompt();
  }

  function handleAuthSubmit(e) {
    e.preventDefault();
    const savedUserEmail = localStorage.getItem('rememberedUserEmail');
    const inputValue = document.getElementById('authInput').value.trim();

    if (!savedUserEmail) {
      const email = inputValue.toLowerCase();
      
      db.collection('users').doc(email).get().then((doc) => {
        if (!doc.exists) {
          showPopup('Access Denied', 'Username not found in database!<br>Please contact admin on Whatsapp:<br><strong>0313-9196058</strong>');
          return;
        }
        const user = doc.data();
        if (user.isBlocked) {
          showPopup('Account Blocked', 'Your account has been blocked by Admin!<br>Please contact support on Whatsapp:<br><strong>0313-9196058</strong>');
          return;
        }

        localStorage.setItem('rememberedUserEmail', email);
        setupPinPrompt(email);
      }).catch((err) => {
        showPopup('Error', err.message);
      });

    } else {
      db.collection('users').doc(savedUserEmail).get().then((doc) => {
        if (!doc.exists) {
          localStorage.removeItem('rememberedUserEmail');
          location.reload();
          return;
        }
        const user = doc.data();
        if (user.password !== inputValue) {
          showPopup('Invalid PIN', 'Incorrect PIN entered!<br>Please try again or contact admin on Whatsapp:<br><strong>0313-9196058</strong>');
          return;
        }

        localStorage.setItem('loggedInUser', JSON.stringify(user));
        document.getElementById('loginOverlay').style.display = 'none';
        loadUserData(user);
      }).catch((err) => {
        showPopup('Error', err.message);
      });
    }
  }

function loadUserData(activeUser) {
    if (!activeUser || !activeUser.email) return;

    // Har baar home page khulne par Firestore se latest balance lana
    db.collection('users').doc(activeUser.email).get().then((doc) => {
      if (doc.exists) {
        const freshUser = doc.data();
        
        // Local storage ko update karna
        localStorage.setItem('loggedInUser', JSON.stringify(freshUser));
        localStorage.setItem('userBalance', freshUser.balance);

        const currentBal = Number(freshUser.balance || 0);
        let formattedBalance = currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        const balanceEl = document.querySelector('.balance-amount');
        if (balanceEl) {
          balanceEl.innerHTML = `Rs. ${formattedBalance} <img src="add.png" class="balance-icon-img" alt="Add">`;
        }
      }
    }).catch((err) => {
      console.error("Error fetching balance:", err);
    });
  }

  function logoutUser() {
    localStorage.removeItem('loggedInUser');
    location.reload();
  }

  document.querySelector('.avatar').addEventListener('dblclick', () => {
    let adminInput = prompt('Enter new balance for admin recharge:', '50000');
    if (adminInput !== null && adminInput.trim() !== '') {
      let updatedAmount = Number(adminInput);
      if (!isNaN(updatedAmount)) {
        localStorage.setItem('userBalance', updatedAmount);
        showPopup('Success', 'Balance successfully updated!<br>Contact admin on Whatsapp for support:<br><strong>0313-9196058</strong>');
        location.reload();
      } else {
        showPopup('Error', 'Please enter a valid number!');
      }
    }
  });
</script>
</body>
</html>
